<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:brewer="http://brewer.algaworks.com"
	xmlns:data="http://www.thymeleaf.org/extras/data"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

<head>
<title>Pesquisa de decisoes</title>
	<link rel="stylesheet" type="text/css" th:href="@{/stylesheets/vendors/select2.min.css}"/>
</head>

<body>
	<section layout:fragment="conteudo">
		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>Pesquisa de decisoes</h1>
					</div>

					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/decisoes/nova}"> <i
								class="glyphicon  glyphicon-plus-sign"></i> <span
								class="hidden-xs  hidden-sm">Nova decisao</span>
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="container-fluid">
			<form method="GET" th:object="${decisaoFilter}">
				<div class="row">
					<div class="form-group  col-sm-6">
						<label class="control-label" for="ambito">Ambito</label> <input
							type="text" class="form-control" id="ambito"
							autofocus="autofocus" th:field="*{ambito}" />
					</div>

					<div class="form-group  col-sm-6">
						<label class="control-label" for="descricaoDecisao">Decisao</label> <input
							type="text" class="form-control" id="descricaoDecisao"
							th:field="*{descricaoDecisao}" />
					</div>
				</div>

				<div class="row">
					<div class="form-group  col-sm-6">
						<label class="control-label" for="estilo">Entidade</label> <select
							id="estilo" class="form-control" th:field="*{entidade}">
							<option value="">Todas as entidades</option>
							<option th:each="entidade : ${entidades}"
								th:text="${entidade.nome}" th:value="${entidade.codigo}"></option>
						</select>
					</div>

					<div class="form-group  col-sm-6">
						<label class="control-label" for="sabor">Ponto situacao</label> <select
							id="sabor" class="form-control" th:field="*{pontoSituacao}">
							<option value="">Selecione o ponto de situacao</option>
							<option th:each="pontoSituacao : ${pontosSituacoes}"
								th:value="${pontoSituacao}" th:text="${pontoSituacao}"></option>
						</select>
					</div>
				</div>

				<div class="row">

					<div class="form-group  col-sm-6">
						<label for="dataDecisao">Data da decisão</label>
						<div class="form-inline">
							<input type="text"
								class="form-control  aw-form-control-inline-sm  js-date"
								id="dataDecisao" th:field="*{dataDecisao}" autocomplete="off" />

						</div>
					</div>

					

				</div>

				<button type="submit" class="btn  btn-primary">Pesquisar</button>
			</form>

			<div class="table-responsive  bw-tabela-simples">
				<table class="table">
					<thead>
						<tr>
							<!-- <th class="table-cervejas-col-foto"></th> -->
							<th class="table-cervejas-col-nome"><brewer:order
									page="${pagina}" field="idDecisao" text="ID Decisao" /></th>
							<th class="table-cervejas-col-nome"><brewer:order
									page="${pagina}" field="entidade" text="Entidade" /></th>
							<th class="table-cervejas-col-estilo">Ambito</th>
							<th class="table-cervejas-col-origem">Decisao</th>
					 	<th class="table-cervejas-col-valor">Responsavel</th> 
							<th class="table-cervejas-col-valor">Data decisao</th>
								<th class="table-cervejas-col-valor">Prazo</th>
							<th class="table-cervejas-col-valor">Estado</th>
						<!-- 	<th class="table-cervejas-col-valor">Observacoes</th> -->
						<!-- 	<th class="table-cervejas-col-valor">Criado por</th> -->
							<!-- <th class="table-cervejas-col-valor">Actualizado por</th> -->
							<!-- <th class="table-cervejas-col-valor">Data de criacao</th> -->
						<!-- 	<th class="table-cervejas-col-valor">Data de actualizacao</th> -->
							<th class="table-cervejas-col-acoes">Accoes</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="decisao : ${pagina.conteudo}" >
						
							<td  th:text="${decisao.idDecisao}"></td>
							<td th:text="${decisao.entidade.nome}"></td>
							<td th:text="${decisao.ambito}"></td>
							<td th:text="${decisao.descricaoDecisao}"></td>
						<td>
								<ul>
									<li th:each="entidade  : ${decisao.pontosFocais}"
										th:text="${entidade.pontoFocal}"></li>
								</ul>
							</td>
							<td th:text="${decisao.dataDecisao}"></td>
							 <td th:text="${decisao.prazo}"></td>
							
                           
                           <td>
    <span th:if="${decisao.pontoSituacao.name() == 'CONCLUIDA'}" class="label label-success">CONCLUÍDO</span>
    <span th:if="${decisao.pontoSituacao.name() == 'PENDENTE'}" class="label label-warning">PENDENTE</span>
    <span th:if="${decisao.pontoSituacao.name() == 'EM_PROGRESSO'}" class="label label-info">EM PROGRESSO</span>
    <span th:if="${decisao.pontoSituacao.name() == 'ATRASADA'}" class="label label-danger">ATRASADA</span>
</td>
                            					
						<!-- 	<td th:text="${decisao.observacao}"></td> -->
							<!-- <td th:text="${decisao.usuarioCriacao.nome}"></td> -->
						<!-- 	<td th:text="${decisao.usuarioActualizacao.nome}"></td> -->
					<!-- 		<td th:text="${decisao.dataCriacao}"></td> -->
						<!-- 	<td th:text="${decisao.dataActualizacao}"></td> -->
					
						<!-- <td>
                Button to open modal for the selected book
                <button type="button" class="btn btn-default" 
        data-toggle="modal" 
        th:attr="data-target='#infoModal' + decisao.codigo">
    View Details
</button>
            </td> -->
							<td><a
								class="btn  btn-link  btn-xs  js-tooltip" title="Editar"
								th:href="@{/decisoes/{codigo}(codigo=${decisao.codigo})}"> <i
									class="glyphicon glyphicon-pencil"></i>
							</a> <a class="btn  btn-link  btn-xs  js-tooltip  js-exclusao-btn"
								title="Excluir" href="#"
								data:url="@{/decisoes/{codigo}(codigo=${decisao.codigo})}"
								data:objeto="${decisao.idDecisao}"> <i
									class="glyphicon glyphicon-remove"></i>
							</a></td>
						</tr>
						<tr th:if="${pagina.vazia}">
							<td colspan="7">Nenhuma decisao encontrada</td>
						</tr>
					</tbody>
				</table>
			</div>
<!-- Modal template for each book -->

 <!-- Modal -->
 <div th:each="decisao : ${decisoes}">
    <div class="modal fade" th:id="'infoModal' + decisao.codigo" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          
          <div class="modal-header">
            <h5 class="modal-title">Detalhes da Decisão</h5>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          
          <div class="modal-body">
 <p><strong>Observação:</strong> <span th:text="${decisao.observacao}"></span></p>
            <p><strong>Usuário Atualização:</strong> <span th:text="${decisao.usuarioActualizacao.nome}"></span></p>
          </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
          </div>
          
        </div>
      </div>
    </div>
</div>

			<brewer:pagination page="${pagina}" />

		

	</section>
	
	<script th:src="@{/javascripts/vendors/select2.full.min.js}"></script>
	<script th:src="@{/javascripts/multiselecao.js}"></script>
	
	<script>
    function showModal(modalId) {
        document.getElementById(modalId).style.display = 'block';
    }

    function hideModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }
</script>
	<script>
		$(function() {
			//Initialize Select2 Elements
			$(".select2").select2()

		});
	</script>
</body>
</html>
