<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:brewer="http://brewer.algaworks.com"
	xmlns:data="http://www.thymeleaf.org/extras/data"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

<head>
<title>Pesquisa de decisoes</title>
<link rel="stylesheet" type="text/css"
	th:href="@{/stylesheets/vendors/select2.min.css}" />
</head>

<body>


	<div class="container-fluid">

		<div class="table-responsive  bw-tabela-simples">
			<div th:fragment="listaDecisoes">
				<table class="table table-bordered">
					<thead>
						<tr>
							<th>Código</th>
							<th>Âmbito</th>
							<th>Situação</th>
							<th>Data</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="d :{decisoes}">
							<td th:text="d.idDecisao">DEC001</td>
							<td th:text="{d.ambito}">Educação</td>
							<td><span
								th:if="${decisao.pontoSituacao.name() == 'EM_PROGRESSO'}"
								class="label label-info">EM PROGRESSO</span></td>
							<td th:text="{#temporals.format(d.dataDecisao, 'dd/MM/yyyy')}">15/11/2025</td>
						</tr>
					</tbody>
				</table>
			</div>





		</div>



	</div>


	<script th:src="@{/javascripts/vendors/select2.full.min.js}"></script>
	<script th:src="@{/javascripts/multiselecao.js}"></script>
	<script th:src="@{/layout/javascripts/vendors.min.js}"></script>
	<script th:src="@{/layout/javascripts/algaworks.min.js}"></script>
	<script>
		$(function() {
			//Initialize Select2 Elements
			$(".select2").select2()

		});
	</script>
</body>
</html>
